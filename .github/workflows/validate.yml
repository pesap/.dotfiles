name: validate
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 8 * * 1'
permissions: {contents: read}
jobs:
  checks:
    runs-on: ubuntu-24.04
    env:
      MISE_CONFIG_FILE: mise/.config/mise/config.toml
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with: {python-version: '3.12'}
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14
        with:
          version: 2026.7.14
          sha256: fc96308f4fa085d7359892ac6351ededb35ecfabf1ddc34f5757bc755a2af8a6
          install: false
          cache: false
      - run: sudo apt-get update && sudo apt-get install --yes zsh
      - name: Install validation tools through mise
        run: |
          mise install gitleaks jq neovim ripgrep shellcheck shfmt prek
          mise reshim
          echo "$HOME/.local/share/mise/shims" >> "$GITHUB_PATH"
      - run: prek run --all-files
      - run: ./scripts/validate.sh

  dependency-report:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    env:
      MISE_CONFIG_FILE: mise/.config/mise/config.toml
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14
        with:
          version: 2026.7.14
          sha256: fc96308f4fa085d7359892ac6351ededb35ecfabf1ddc34f5757bc755a2af8a6
          install: false
          cache: false
      - name: Report outdated pins
        run: mise outdated --bump
