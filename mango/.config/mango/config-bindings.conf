# Key bindings
bind=SUPER,r,reload_config
bind=SUPER+SHIFT,r,reload_config

# Launchers
bind=Alt,Return,spawn,alacritty
bind=SUPER,B,focusmon,DP-1
bind=SUPER,B,view,1,0
bind=SUPER,B,spawn_shell,pgrep -x brave >/dev/null 2>&1 || pgrep -x brave-browser >/dev/null 2>&1 || brave
bind=SUPER,d,focusmon,DP-1
bind=SUPER,d,view,2,0
bind=SUPER,d,spawn_shell,pgrep -x vesktop >/dev/null 2>&1 || vesktop
bind=SUPER,Return,spawn,alacritty
bind=SUPER,space,spawn,vicinae toggle
bind=SUPER,Escape,spawn,swaylock -f
bind=SUPER+SHIFT,s,spawn,grim -g "$(slurp)" - | wl-copy
bind=SUPER+CTRL,s,spawn,grim - | wl-copy

# Session and client
bind=SUPER+SHIFT,m,quit
bind=ALT,q,killclient,
bind=SUPER,q,killclient

# Focus
bind=SUPER,Tab,focusstack,next
bind=SUPER,j,focusstack,next
bind=SUPER,k,focusstack,prev
bind=ALT,Left,focusdir,left
bind=ALT,Right,focusdir,right
bind=ALT,Up,focusdir,up
bind=ALT,Down,focusdir,down
bind=SUPER,h,focusdir,left
bind=SUPER,l,focusdir,right

# Swap and move
bind=SUPER+SHIFT,Up,exchange_client,up
bind=SUPER+SHIFT,Down,exchange_client,down
bind=SUPER+SHIFT,Left,exchange_client,left
bind=SUPER+SHIFT,Right,exchange_client,right
bind=SUPER+SHIFT,k,exchange_client,up
bind=SUPER+SHIFT,j,exchange_client,down
bind=SUPER+SHIFT,h,exchange_client,left
bind=SUPER+SHIFT,l,exchange_client,right
bind=CTRL+SHIFT,Up,movewin,+0,-50
bind=CTRL+SHIFT,Down,movewin,+0,+50
bind=CTRL+SHIFT,Left,movewin,-50,+0
bind=CTRL+SHIFT,Right,movewin,+50,+0
bind=CTRL+SHIFT,k,smartmovewin,up
bind=CTRL+SHIFT,j,smartmovewin,down
bind=CTRL+SHIFT,h,smartmovewin,left
bind=CTRL+SHIFT,l,smartmovewin,right
bind=CTRL+ALT,Up,resizewin,+0,-50
bind=CTRL+ALT,Down,resizewin,+0,+50
bind=CTRL+ALT,Left,resizewin,-50,+0
bind=CTRL+ALT,Right,resizewin,+50,+0

# States and layout
bind=SUPER,g,toggleglobal,
bind=ALT,Tab,toggleoverview,
bind=SUPER,0,toggleoverview
bind=ALT,backslash,togglefloating,
bind=SUPER,f,togglefloating,
bind=ALT,a,togglemaximizescreen,
bind=ALT+SHIFT,f,togglefullscreen,
bind=SUPER+SHIFT,f,togglefullscreen,
bind=ALT+CTRL,f,togglefakefullscreen,
bind=SUPER,i,minimized,
bind=SUPER+SHIFT,I,restore_minimized
bind=SUPER,o,toggleoverlay,
bind=ALT,z,toggle_scratchpad
bind=ALT,e,set_proportion,1.0
bind=ALT,x,switch_proportion_preset,
bind=SUPER,n,switch_layout
bind=SUPER,t,setlayout,tile
bind=SUPER,v,spawn,wtype -M ctrl v -m ctrl
bind=SUPER,c,spawn,wtype -M ctrl c -m ctrl
bind=SUPER,x,setlayout,scroller
bind=SUPER,a,togglegaps
bind=SUPER+CTRL,i,incnmaster,+1
bind=SUPER+SHIFT,p,incnmaster,-1

# Tag and monitor navigation
bind=SUPER,Left,viewtoleft,0
bind=CTRL,Left,viewtoleft_have_client,0
bind=SUPER,Right,viewtoright,0
bind=CTRL,Right,viewtoright_have_client,0
bind=CTRL+SUPER,Left,tagtoleft,0
bind=CTRL+SUPER,Right,tagtoright,0
bind=SUPER+SHIFT,4,tag,4,0
bind=Ctrl,1,view,1,0
bind=Ctrl,2,view,2,0
bind=Ctrl,3,view,3,0
bind=Ctrl,4,view,4,0
bind=Ctrl,5,view,5,0
bind=Ctrl,6,view,6,0
bind=Ctrl,7,view,7,0
bind=Ctrl,8,view,8,0
bind=Ctrl,9,view,9,0
bind=Alt,1,view,1,0
bind=Alt,1,spawn_shell,pgrep -x alacritty >/dev/null 2>&1 || alacritty
bind=Alt,2,focusmon,HDMI-A-1
bind=Alt,2,view,2,0
bind=Alt,2,spawn_shell,pgrep -x librewolf >/dev/null 2>&1 || pgrep -x librewolf-bin >/dev/null 2>&1 || librewolf
bind=Alt,3,view,3,0
bind=Alt,4,view,4,0
bind=Alt,5,view,5,0
bind=Alt,6,view,6,0
bind=Alt,7,view,7,0
bind=Alt,8,view,8,0
bind=Alt,9,view,9,0
# Fallback for keyboards where Option/Cmd is seen as SUPER instead of ALT.
bind=SUPER,1,view,1,0
bind=SUPER,1,spawn_shell,pgrep -x alacritty >/dev/null 2>&1 || alacritty
bind=SUPER,2,focusmon,HDMI-A-1
bind=SUPER,2,view,2,0
bind=SUPER,2,spawn_shell,pgrep -x librewolf >/dev/null 2>&1 || pgrep -x librewolf-bin >/dev/null 2>&1 || librewolf
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0
bind=SUPER,comma,focusmon,DP-1
bind=SUPER,period,focusmon,HDMI-A-1
bind=SUPER+SHIFT,comma,tagmon,DP-1
bind=SUPER+SHIFT,period,tagmon,HDMI-A-1

# Gap controls
bind=ALT+SHIFT,X,incgaps,1
bind=ALT+SHIFT,Z,incgaps,-1
bind=ALT+SHIFT,R,togglegaps

# Pointer and gestures
mousebind=SUPER,btn_left,moveresize,curmove
# mousebind=NONE,btn_middle,togglemaximizescreen,0
mousebind=SUPER,btn_right,moveresize,curresize
axisbind=SUPER,UP,viewtoleft_have_client
axisbind=SUPER,DOWN,viewtoright_have_client
gesturebind=none,left,3,focusdir,left
gesturebind=none,right,3,focusdir,right
gesturebind=none,up,3,focusdir,up
gesturebind=none,down,3,focusdir,down
gesturebind=none,left,4,viewtoleft_have_client
gesturebind=none,right,4,viewtoright_have_client
gesturebind=none,up,4,toggleoverview
gesturebind=none,down,4,toggleoverview
