# Per-tag default layout
tagrule=id:1,layout_name:tile
tagrule=id:2,layout_name:tile
tagrule=id:3,layout_name:tile
tagrule=id:4,layout_name:tile
tagrule=id:5,layout_name:tile
tagrule=id:6,layout_name:tile
tagrule=id:7,layout_name:tile
tagrule=id:8,layout_name:tile
tagrule=id:9,layout_name:tile

# App rules
# Steam games follow the active desk/headless output profile.
windowrule=appid:Alacritty,tags:1,monitor:HDMI-A-1
windowrule=appid:alacritty,tags:1,monitor:HDMI-A-1
windowrule=appid:org.alacritty.Alacritty,tags:1,monitor:HDMI-A-1
windowrule=appid:brave-browser,tags:1,monitor:DP-1
windowrule=appid:Brave-browser,tags:1,monitor:DP-1
windowrule=appid:brave,tags:1,monitor:DP-1
windowrule=appid:librewolf,tags:2,monitor:HDMI-A-1
windowrule=appid:LibreWolf,tags:2,monitor:HDMI-A-1
windowrule=appid:io.gitlab.librewolf-community,tags:2,monitor:HDMI-A-1
windowrule=appid:vesktop,tags:2,monitor:DP-1
windowrule=appid:Vesktop,tags:2,monitor:DP-1
windowrule=appid:dev.vencord.Vesktop,tags:2,monitor:DP-1

# Layer rules
layerrule=noanim:1,layer_name:rofi

# Monitor rules
# Keep host-specific monitor geometry in config-override.conf.
