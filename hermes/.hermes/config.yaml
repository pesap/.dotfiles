# Hermes Agent configuration.
#
# This file is managed by the dotfiles repository and stowed to
# ~/.hermes/config.yaml. Keep API keys, bot tokens, and other credentials in
# ~/.hermes/.env; runtime state under ~/.hermes is intentionally unmanaged.

_config_version: 33

model:
  default: qwen3.8-27B:latest
  provider: custom
  base_url: http://127.0.0.1:11434/v1
  context_length: 100000
  ollama_num_ctx: 65536
  api_key: ollama

fallback_providers: []
toolsets:
  - hermes-cli

agent:
  max_turns: 150
  gateway_timeout: 1800
  restart_drain_timeout: 60
  api_max_retries: 3
  gateway_notify_interval: 600
  verbose: false
  reasoning_effort: medium
  personalities:
    kawaii: >-
      You are a kawaii assistant! Use cute expressions like (◕‿◕), ★, ♪, and ~!
      Add sparkles and be super enthusiastic about everything desu~! ヽ(>∀<☆)ノ

terminal:
  backend: local
  cwd: .
  lifetime_seconds: 300

browser:
  cloud_provider: local

checkpoints:
  enabled: true
  max_snapshots: 50
  max_total_size_mb: 500
  max_file_size_mb: 10
  auto_prune: true
  retention_days: 7
  delete_orphans: true

auxiliary:
  compression:
    model: google/gemini-3-flash-preview

display:
  personality: kawaii
  streaming: true
  tool_progress: all
  background_process_notifications: all

memory:
  memory_enabled: true
  user_profile_enabled: true
  memory_char_limit: 2200
  user_char_limit: 1375
  nudge_interval: 10
  flush_min_turns: 6

delegation:
  inherit_mcp_toolsets: true
  max_iterations: 50
  child_timeout_seconds: 600
  max_concurrent_children: 3
  max_spawn_depth: 1
  orchestrator_enabled: true
  subagent_auto_approve: false
  default_toolsets:
    - terminal
    - file
    - web

skills:
  creation_nudge_interval: 15

approvals:
  mode: manual
  timeout: 60
  cron_mode: deny
  mcp_reload_confirm: true
  destructive_slash_confirm: true

# Commands approved interactively in the current Hermes profile. Review this
# list before changing the agent's approval policy.
command_allowlist:
  - stop/restart system service
  - script execution via -e/-c flag
  - execute remote script via process substitution
  - pipe remote content to shell
  - recursive delete
  - chmod +x followed by immediate execution
  - script execution via heredoc
  - git reset --hard (destroys uncommitted changes)
  - shell command via -c/-lc flag
  - git branch force delete
  - git force push (rewrites remote history)

code_execution:
  timeout: 300
  max_tool_calls: 50

session_reset:
  mode: both
  idle_minutes: 1440
  at_hour: 4

group_sessions_per_user: true

platform_toolsets:
  cli:
    - browser
    - clarify
    - code_execution
    - cronjob
    - delegation
    - file
    - image_gen
    - memory
    - session_search
    - skills
    - terminal
    - todo
    - tts
    - vision
    - web
  discord:
    - browser
    - clarify
    - code_execution
    - cronjob
    - delegation
    - file
    - image_gen
    - memory
    - session_search
    - skills
    - terminal
    - todo
    - tts
    - vision
    - web

custom_providers:
  - name: Api.fireworks.ai
    base_url: https://api.fireworks.ai/inference/v1
    key_env: FIREWORKS_API_KEY
    model: accounts/fireworks/routers/kimi-k2p5-turbo
    models:
      accounts/fireworks/routers/kimi-k2p5-turbo:
        context_length: 256000
  - name: qwen
    base_url: http://127.0.0.1:11434/v1
    api_key: ollama
    model: qwen3.8-27B:latest

plugins:
  enabled: []
