[general]
import = [
    "~/.config/alacritty/themes/themes/tokyo-night.toml"
]

[font]
size = 18

[font.normal]
family = "0xProto Nerd Font"

[window]
decorations = "none"
startup_mode = "Maximized"
option_as_alt = "Both"

[window.padding]
x = 10
y = 10

[scrolling]
history = 100000

[env]
term = "xterm-256color"
