# Base Alacritty config (shared between macOS and Arch).
# Per-host overrides live in ~/.config/alacritty/local.toml — copy one of:
#   alacritty/.config/alacritty/local.macos.toml
#   alacritty/.config/alacritty/local.linux.toml
# Missing imports are silently skipped, so an absent local.toml is fine.

[general]
import = [
    "~/.config/alacritty/themes/tokyo-night.toml",
    "~/.config/alacritty/local.toml",
]
live_config_reload = true
working_directory = "None"

[env]
# Requires `alacritty` terminfo on every host. macOS: shipped with the .app
# (install with `tic`/copy to ~/.terminfo). Arch: pacman -S alacritty-terminfo.
# SSH targets without it: set TERM=xterm-256color in your ssh wrapper.
TERM = "alacritty"

[window]
startup_mode = "Maximized"
dynamic_padding = true
dynamic_title = true
resize_increments = true        # snap window resize to cell boundaries

[window.padding]
x = 10
y = 10

[scrolling]
history = 10000                 # Keep a useful native scrollback buffer
multiplier = 3

[font]
size = 16
builtin_box_drawing = true      # built-in box/powerline glyphs, pixel-perfect

[font.normal]
family = "0xProto Nerd Font"
style  = "Regular"

[font.bold]
family = "0xProto Nerd Font"
style  = "Bold"

[font.italic]
family = "0xProto Nerd Font"
style  = "Italic"

[font.bold_italic]
family = "0xProto Nerd Font"
style  = "Bold Italic"

[font.offset]
x = 0
y = 0

[cursor]
unfocused_hollow = true         # visual cue when window loses focus
blink_interval = 750
blink_timeout = 5

[cursor.style]
shape = "Block"
blinking = "Off"

[mouse]
hide_when_typing = true

[selection]
save_to_clipboard = true

[colors]
draw_bold_text_with_bright_colors = false   # respect theme bold semantics

[bell]
animation = "EaseOutExpo"
duration = 0                    # set to 100 if you want a brief visual flash
color = "#ffffff"

[terminal]
osc52 = "OnlyCopy"              # remote shells can write to clipboard, not read

[keyboard]
bindings = [
    # Cmd+\\ on macOS / Super+\\ on Linux becomes Ctrl+\\. Outside Herdr,
    # zsh launches herdr-project; inside Herdr, its native popup handles it.
    { key = "Backslash", mods = "Super", chars = "\u001c" },

    # ── Font size (live) ─────────────────────────────────────────────────────
    { key = "Equals", mods = "Command",       action = "IncreaseFontSize" },
    { key = "Minus",  mods = "Command",       action = "DecreaseFontSize" },
    { key = "Key0",   mods = "Command",       action = "ResetFontSize"   },
    { key = "Equals", mods = "Control|Shift", action = "IncreaseFontSize" },
    { key = "Minus",  mods = "Control|Shift", action = "DecreaseFontSize" },
    { key = "Key0",   mods = "Control|Shift", action = "ResetFontSize"   },

    # ── Native scrollback search ──────────────────────────────────────────────
    { key = "F", mods = "Command",       action = "SearchForward"  },
    { key = "B", mods = "Command",       action = "SearchBackward" },
    { key = "F", mods = "Control|Shift", action = "SearchForward"  },
    { key = "B", mods = "Control|Shift", action = "SearchBackward" },

    # ── Disarm Cmd-Q rage-quit (macOS); Cmd-Shift-Q still quits ─────────────
    { key = "Q", mods = "Command",       action = "ReceiveChar" },
    { key = "Q", mods = "Command|Shift", action = "Quit"         },
]
