# Linux-specific Alacritty overrides.
# Copy or symlink to ~/.config/alacritty/local.toml on Arch / other Linux hosts.

[window]
decorations = "none"            # tiling WMs draw their own borders
opacity = 0.97
blur = true                     # honored by KDE Wayland, ignored elsewhere
# decorations_theme_variant = "Dark"   # uncomment for GTK/Wayland CSD hosts

[window.class]
instance = "Alacritty"
general  = "Alacritty"          # Wayland uses this as app_id for window rules

[hints]
# Default ships `xdg-open` with Ctrl+Shift+O which is exactly what we want;
# repeated here for parity with the macOS file.
[[hints.enabled]]
regex = "(ipfs:|ipns:|magnet:|mailto:|gemini://|gopher://|https://|http://|news:|file:|git://|ssh:|ftp://)[^\u0000-\u001F\u007F-\u009F<>\"\\s{-}\\^⟨⟩`\\\\]+"
hyperlinks = true
post_processing = true
persist = false
mouse = { enabled = true, mods = "Control" }
binding = { key = "O", mods = "Control|Shift" }
command = "xdg-open"
