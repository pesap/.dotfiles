# Common dotfiles. Directory entries preserve unmanaged neighbors.
[dotfiles]
"~/.config/alacritty" = { source = "../../alacritty", mode = "symlink", manifest = "git" }
"~/.config/atuin" = { source = "../../atuin", mode = "symlink", manifest = "git" }
"~/.config/bashrc" = { source = "../../bash/config", mode = "symlink", manifest = "git" }
"~/.aliases" = "../../aliases/common"
"~/.config/herdr" = { source = "../../herdr", mode = "symlink", manifest = "git" }
"~/.config/mise/config.toml" = "../../mise.toml"
"~/.config/mise/mise.lock" = "../../mise.lock"
"~/.config/mise/config.linux.toml" = "../config.linux.toml"
"~/.config/mise/config.macos.toml" = "../config.macos.toml"
"~/.config/mise/config.personal.toml" = "../config.personal.toml"
"~/.config/mise/conf.d" = { source = "../conf.d", mode = "symlink-each", manifest = "git" }
"~/.config/nvim" = { source = "../../nvim", mode = "symlink", manifest = "git" }
"~/.config/worktrunk" = { source = "../../worktrunk", mode = "symlink", manifest = "git" }
"~/.config/zshrc" = { source = "../../zshrc/config", mode = "symlink", manifest = "git" }
"~/.local/bin" = { source = "../../bin", mode = "symlink-each", manifest = "git" }
"~/.pi" = { source = "../../pi", mode = "symlink-each", manifest = "git" }
"~/.bash_profile" = "../../bash/.bash_profile"
"~/.bashrc" = "../../bash/.bashrc"
"~/.config/starship.toml" = "../../starship/starship.toml"
"~/.hermes/config.yaml" = "../../hermes/.hermes/config.yaml"
"~/.zprofile" = "../../zshrc/.zprofile"
"~/.zsh_plugins.txt" = "../../zshrc/.zsh_plugins.txt"
"~/.zshenv" = "../../zshrc/.zshenv"
"~/.zshrc" = "../../zshrc/.zshrc"
