# macOS workstation dotfiles and platform-specific resources.
[vars]
platform = "macos"

[dotfiles]
"~/.aliases.os" = "../aliases/macos"
"~/.config/sketchybar" = { source = "../sketchybar", mode = "symlink" }
"~/.config/skhd" = { source = "../skhd", mode = "symlink" }
"~/.config/yabai" = { source = "../yabai", mode = "symlink" }
