# Canonical workstation configuration managed by mise.
# Run `mise -C ~/.dotfiles bootstrap dotfiles apply` from this checkout after
# reviewing the dry run. Shared dotfiles and bootstrap settings live in
# mise/config.toml; platform-specific and optional personal files use matching environments.
min_version = "2026.8.15"

[tools]
starship = "1"
ripgrep = "15"
fd = "10"
fzf = "0.74"
gitleaks = "8"
jq = "1"
herdr = "0.8"
worktrunk = "0.75"
codex = "0.147"
copilot = "1"
bat = "0.26"
lsd = "1"
zoxide = "0.10"
atuin = "18"
"cargo:navi" = "2"
yazi = "26"
neovim = "0.12"
tree-sitter = "0.26"
uv = "latest"
julia = "1"
prek = "0.4"
shellcheck = "0.11"
shfmt = "3"
gh = "2"
node = "26"
npm = "11"
pi = "latest"
ruff = "0.16"
"github:vicinaehq/vicinae" = { version = "0.25", asset_pattern = "vicinae-linux-x86_64-v{version}.tar.gz", os = [
  "linux",
] }
"cargo:stylua" = "2"
"lua-language-server" = "3"
just = "1"
rust = "1"
"rust-analyzer" = "2026-08"
ollama = "0.32"

[settings]
dotfiles.root = "~/.dotfiles"
dotfiles.default_mode = "symlink"
lockfile = true
lockfile_platforms = ["linux-x64", "macos-arm64", "macos-x64"]

[tool_config]
locked = true
