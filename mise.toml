# Canonical workstation configuration managed by mise.
# Run `mise -C ~/.dotfiles bootstrap dotfiles apply` from this checkout after
# reviewing the dry run. Platform-specific and optional personal files belong
# in the matching config.linux.toml and config.macos.toml environments.
min_version = "2026.8.15"

[tools]
starship = "1.26.0"
ripgrep = "15.2.0"
fd = "10.4.2"
fzf = "0.74.2"
gitleaks = "8.30.1"
jq = "1.8.2"
herdr = "0.8.0"
worktrunk = "0.75.0"
codex = "0.147.0"
bat = "0.26.1"
lsd = "1.2.0"
zoxide = "0.10.0"
atuin = "18.19.0"
"cargo:navi" = "2.24.0"
yazi = "26.5.6"
neovim = "0.12.4"
uv = "0.12.3"
julia = "1.12.7"
prek = "0.4.13"
shellcheck = "0.11.0"
shfmt = "3.14.0"
gh = "2.97.0"
node = "26.7.0"
npm = "11.19.0"
pi = "0.84.1"
ruff = "0.16.5"
"github:vicinaehq/vicinae" = { version = "0.25.0", asset_pattern = "vicinae-linux-x86_64-v{version}.tar.gz", os = [
  "linux",
] }
"cargo:stylua" = "2.5.2"
"lua-language-server" = "3.19.1"
just = "1.58.0"
rust = "1.97.1"
"rust-analyzer" = "2026-08-24"
ollama = "0.32.14"

[settings]
dotfiles.root = "~/.dotfiles"
dotfiles.default_mode = "symlink"
lockfile = true
lockfile_platforms = ["linux-x64", "macos-arm64", "macos-x64"]

[tool_config]
locked = true
