# Canonical workstation configuration managed by mise.
# Run `mise -C ~/.dotfiles bootstrap dotfiles apply` from this checkout after
# reviewing the dry run. Platform-specific and optional personal files belong
# in mise.linux.toml, mise.macos.toml, and mise.personal.toml.
min_version = "2026.7.14"

[tools]
starship = "1.26.0"
ripgrep = "15.2.0"
fd = "10.4.2"
fzf = "0.74.2"
gitleaks = "8.30.1"
jq = "1.8.2"
herdr = "0.8.0"
worktrunk = "0.75.0"
codex = "0.147.0"
bat = "0.26.1"
lsd = "1.2.0"
zoxide = "0.10.0"
atuin = "18.19.0"
"cargo:navi" = "2.24.0"
yazi = "26.5.6"
neovim = "0.12.4"
uv = "0.12.3"
julia = "1.12.7"
prek = "0.4.13"
shellcheck = "0.11.0"
shfmt = "3.14.0"
gh = "2.97.0"
node = "26.7.0"
npm = "11.19.0"
pi = "0.84.1"
ruff = "0.16.5"
"github:vicinaehq/vicinae" = { version = "0.25.0", asset_pattern = "vicinae-linux-x86_64-v{version}.tar.gz", os = [
  "linux",
] }
"cargo:stylua" = "2.5.2"
"lua-language-server" = "3.19.1"
just = "1.58.0"
rust = "1.97.1"
"rust-analyzer" = "2026-08-24"
ollama = "0.32.14"

[settings]
dotfiles.root = "~/.dotfiles"
dotfiles.default_mode = "symlink"

[dotfiles]
# Directory entries use individual links so mise preserves unrelated runtime
# files already present in these directories. The Git manifest excludes local
# and untracked files from ownership.
"~/.config/alacritty" = { source = "~/.dotfiles/alacritty/.config/alacritty", mode = "symlink-each", manifest = "git" }
"~/.config/atuin" = { source = "~/.dotfiles/atuin/.config/atuin", mode = "symlink-each", manifest = "git" }
"~/.config/bashrc" = { source = "~/.dotfiles/bash/.config/bashrc", mode = "symlink-each", manifest = "git" }
"~/.config/herdr" = { source = "~/.dotfiles/herdr/.config/herdr", mode = "symlink-each", manifest = "git" }
"~/.config/mise/config.toml" = "~/.dotfiles/mise.toml"
"~/.config/mise/mise.lock" = "~/.dotfiles/mise.lock"
"~/.config/nvim" = { source = "~/.dotfiles/nvim/.config/nvim", mode = "symlink-each", manifest = "git" }
"~/.config/worktrunk" = { source = "~/.dotfiles/worktrunk/.config/worktrunk", mode = "symlink-each", manifest = "git" }
"~/.config/zshrc" = { source = "~/.dotfiles/zshrc/.config/zshrc", mode = "symlink-each", manifest = "git" }
"~/.local/bin" = { source = "~/.dotfiles/bin/.local/bin", mode = "symlink-each", manifest = "git" }
"~/.pi" = { source = "~/.dotfiles/pi/.pi", mode = "symlink-each", manifest = "git" }

# Whole-file entries are appropriate for standalone files.
"~/.bash_profile" = "~/.dotfiles/bash/.bash_profile"
"~/.bashrc" = "~/.dotfiles/bash/.bashrc"
"~/.config/starship.toml" = "~/.dotfiles/starship/.config/starship.toml"
"~/.hermes/config.yaml" = "~/.dotfiles/hermes/.hermes/config.yaml"
"~/.zprofile" = "~/.dotfiles/zshrc/.zprofile"
"~/.zsh_plugins.txt" = "~/.dotfiles/zshrc/.zsh_plugins.txt"
"~/.zshenv" = "~/.dotfiles/zshrc/.zshenv"
"~/.zshrc" = "~/.dotfiles/zshrc/.zshrc"
