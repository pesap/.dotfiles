id = "pesap.herdr-zessioner"
name = "Herdr Zessioner"
version = "0.1.0"
min_herdr_version = "0.7.5"
description = "Switch between Herdr workspaces or create a fresh workspace from a project"
platforms = ["linux", "macos"]

[[actions]]
id = "open"
title = "Open Herdr zessioner"
contexts = ["workspace"]
command = ["./open.sh"]

[[panes]]
id = "picker"
title = "Herdr Zessioner"
placement = "overlay"
command = ["./picker.sh"]
