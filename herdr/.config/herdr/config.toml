# Herdr workflow extensions
# The plugin is linked from this dotfiles checkout by the setup command below.

[keys]
# Herdr-native indexed workspace navigation: Cmd+1 through Cmd+9.
switch_workspace = "cmd+1..9"

[[keys.command]]
key = "cmd+backslash"
type = "plugin_action"
command = "pesap.herdr-zessioner.open"
description = "open Herdr zessioner"

[ui]
agent_panel_sort = "spaces"
