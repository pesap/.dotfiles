repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
        exclude: 'config\\.jsonc$'
      - id: check-merge-conflict
  - repo: local
    hooks:
      - id: shellcheck
        name: shellcheck (mise)
        entry: shellcheck
        language: system
        args: [-x]
        # ShellCheck does not parse Zsh; maintained entry points remain gated.
        files: ^(scripts/|tests/|bin/\.local/bin/git-checkouts$)
      - id: shfmt
        name: shfmt (mise)
        entry: shfmt
        language: system
        args: [-d, -i, '4']
        # Advanced Zsh is checked with zsh -n because shfmt cannot parse it.
        files: ^(scripts/|tests/|bin/\.local/bin/git-checkouts$)
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
