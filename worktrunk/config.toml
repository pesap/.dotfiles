# ~/.config/worktrunk/config.toml
# Managed via mise dotfiles

# Preserve distinct Git refs even when sanitizing would collapse their names.
worktree-path = "~/worktrees/{{ repo }}/{{ branch | sanitize_hash }}"

[commit.generation]
# Worktrunk passes its rendered prompt on stdin. Use the mise-managed Pi CLI
# instead of an unmanaged provider-specific executable.
command = "pi --no-session --no-tools --no-extensions --no-skills --no-context-files --system-prompt='' --print"

# Worktrunk owns shell directory changes. Herdr's Worktrunk plugin uses
# --no-cd and registers the resulting checkout as a workspace explicitly.
[switch]
cd = true

# ----------------------------------------------------------------------------
# Aliases
# ----------------------------------------------------------------------------

[aliases]
# wt nuke → restore tracked files + remove all untracked/ignored files
nuke = """
git reset --hard HEAD &&
git clean -ffdx
"""

# wt bare git@github.com:owner/repo.git → ./repo/{.bare,.git} + origin refspec
bare = """
url={{ args[0] }} && name=$(basename "$url" .git) && \
mkdir -p "$name" && cd "$name" && \
git clone --bare "$url" .bare && \
printf 'gitdir: ./.bare\n' > .git && \
git config remote.origin.fetch '+refs/heads/*:refs/remotes/origin/*' && \
git fetch origin
"""

# wt fork owner/repo → clone YOUR fork, add upstream, fetch
fork = """
slug={{ args[0] }} && upstream_owner=${slug%/*} && repo=${slug#*/} && \
me=$(git config --global --get github.user) && \
gh repo clone "$me/$repo" -- --origin origin && cd "$repo" && \
git remote add upstream "git@github.com:$upstream_owner/$repo.git" && \
git fetch upstream
"""

[list]
json-schema = 2
