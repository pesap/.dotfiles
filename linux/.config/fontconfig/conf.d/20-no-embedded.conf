<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Disable embedded bitmap fonts (avoids blurry/pixelated fallbacks), but keep
  them enabled for Noto Color Emoji so emoji keep rendering everywhere.
  From the Arch Wiki via the Arch Linux Font Improvement Guide.
-->
<fontconfig>
  <match target="font">
    <edit name="embeddedbitmap" mode="assign">
      <bool>false</bool>
    </edit>
  </match>
  <match target="font">
    <test name="family" qual="any">
      <string>Noto Color Emoji</string>
    </test>
    <edit name="embeddedbitmap" mode="assign">
      <bool>true</bool>
    </edit>
  </match>
</fontconfig>
